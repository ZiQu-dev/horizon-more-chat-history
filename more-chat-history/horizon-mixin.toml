# More Chat History: raises the chat's remembered messages, wrapped lines and
# sent-message history from vanilla's 100 to 16384. A plain mixin bundle (no trait
# mod): three MODIFY_CONSTANT injections on the `100` of the chat's trimming code.
# Pinned to the Horizon commit whose source the selectors were checked against.
[mod]
id = "more_chat_history"
version = "0.1.0"

[compatibility]
horizon_revision = "0a6e409923e72d66105ff21878fe5dc52b1b4b4c"

# ChatComponent.addMessageToQueue: `self.messages.truncate(100)`. The function has println!,
# which the constant rewrite refuses, so a cancellable HEAD runs a copy of its body with the new limit
# and skips the original.
[[injection]]
id = "messages"
target = "horizon_client_render::chat::Chat::push_message"
kind = "HEAD"
cancellable = true
helper = "limit_messages.rs"
bindings = [
  { name = "chat", ty = "&mut Chat", value = "&mut *self" },
  { name = "font", ty = "&crate::font::Font", value = "font" },
  { name = "message", ty = "&Message", value = "&message" },
  { name = "focused", ty = "bool", value = "focused" },
]

# ChatComponent.addMessageToDisplayQueue: `self.lines.truncate(100)`. add_lines has a closure,
# so it gets a copy of its body as well.
[[injection]]
id = "lines"
target = "horizon_client_render::chat::Chat::add_lines"
kind = "HEAD"
cancellable = true
helper = "limit_lines.rs"
bindings = [
  { name = "chat", ty = "&mut Chat", value = "&mut *self" },
  { name = "font", ty = "&crate::font::Font", value = "font" },
  { name = "message", ty = "&Message", value = "message" },
  { name = "focused", ty = "bool", value = "focused" },
]

# ChatComponent.addRecentChat: the sent messages the up arrow walks through (log::error! in
# its body: same treatment).
[[injection]]
id = "recent"
target = "horizon_client_render::chat::Chat::add_recent"
kind = "HEAD"
cancellable = true
helper = "limit_recent.rs"
bindings = [
  { name = "chat", ty = "&mut Chat", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]
